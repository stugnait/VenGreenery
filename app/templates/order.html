<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VenGreenery</title>
    <script src="../static/js/order.js" defer></script>
</head>
<body>
    <form id="input-form" method="POST" action="/payment" style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
        <label>
            <span>Дорослий квиток: </span>
            <input name="adult-quantity" type="number" placeholder="Enter a number" min="0" value="0">
        </label>
        <label>
            <span>Дитячий квиток: </span>
            <input name="child-quantity" type="number" placeholder="Enter a number"  min="0" value="0">
        </label>
        <label>
            Прізвище:
            <input name="user-surname" id="user-surname" type="text" placeholder="Прізвище">
        </label>
        <label>
            Ім'я:
            <input name="user-name" id="user-name" type="text" placeholder="Ім'я">
        </label>
        <label>
            <span>Ваша пошта:</span>
            <input name="user-email" id="user-email" type="email" placeholder="Введіть пошту">
            <span id="invalid-input"></span>
        </label>
        <label>
            <span>Ваш номер телефону:</span>
            <input name="user-phone" id="user-phone" type="tel" placeholder="Введіть номер телефону">
        </label>
    <button type="submit">Придбати</button>
    <button type="reset">Скинути</button>
    </form>
</body>
</html>
